name: Clean deployment history

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-deployments.yml]

permissions:
  deployments: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete deployment records
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              { owner, repo, per_page: 100 }
            );

            core.info(`Found ${deployments.length} deployment records.`);

            for (const deployment of deployments) {
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  description: "Hosted project removed"
                });
              } catch (error) {
                core.info(`Deployment ${deployment.id} could not be marked inactive: ${error.message}`);
              }

              await github.rest.repos.deleteDeployment({
                owner,
                repo,
                deployment_id: deployment.id
              });
              core.info(`Deleted deployment ${deployment.id}.`);
            }
